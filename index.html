<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SysonDev - Labs</title>
<meta name="description" content="SysonDev - Labs. Muy pronto.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #060B1A;
    --surface: #0B1830;
    --cyan: #2DE2E6;
    --violet: #7C5CFC;
    --ice: #E9EEFB;
    --slate: #7C8AAE;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 20%, #0B1830 0%, #060B1A 60%, #030612 100%);
    color: var(--ice);
    font-family: 'Futura', 'Century Gothic', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Red de nodos de fondo, interactiva al mouse */
  #bg-network {
    position: absolute;
    inset: 0;
    z-index: 0;
    display: block;
    opacity: 0.55;
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 56px 44px;
    max-width: 480px;
  }

  .logo {
    width: 132px;
    height: auto;
    margin: 0 auto 8px;
    display: block;
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 28px 0 6px;
    color: var(--ice);
  }

  .sub {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--slate);
    margin: 0 0 32px;
    text-transform: uppercase;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(45, 226, 230, 0.08);
    border: 1px solid rgba(124, 92, 252, 0.35);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ice);
    margin-bottom: 22px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  p.msg {
    font-size: 15px;
    line-height: 1.6;
    color: var(--slate);
    margin: 0 0 30px;
  }

  .contact {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--ice);
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(45, 226, 230, 0.14), rgba(124, 92, 252, 0.14));
    border: 1px solid rgba(233, 238, 251, 0.12);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .contact:hover {
    border-color: rgba(45, 226, 230, 0.6);
    transform: translateY(-1px);
  }

  footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(124, 138, 174, 0.55);
    z-index: 1;
  }
</style>
</head>
<body>

  <canvas id="bg-network" aria-hidden="true"></canvas>

  <main class="card">
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SysonDev Labs">
      <defs>
        <linearGradient id="brandGrad" x1="20" y1="12" x2="80" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2DE2E6"/>
          <stop offset="100%" stop-color="#7C5CFC"/>
        </linearGradient>
        <linearGradient id="hexStroke" x1="4" y1="10" x2="96" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2DE2E6" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0.35"/>
        </linearGradient>
        <clipPath id="flaskClip">
          <path d="M45,22 L55,22 L55,40 L70,58 L74,72 L68,78 L32,78 L26,72 L30,58 L45,40 Z"/>
        </clipPath>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="3.2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <polygon points="96,50 73,10 27,10 4,50 27,90 73,90" fill="#0B1830" stroke="url(#hexStroke)" stroke-width="1.4"/>

      <ellipse cx="50" cy="66" rx="20" ry="14" fill="#7C5CFC" opacity="0.22" filter="url(#glow)"/>

      <rect x="20" y="59" width="60" height="21" fill="url(#brandGrad)" clip-path="url(#flaskClip)"/>
      <path d="M45,22 L55,22 L55,40 L70,58 L74,72 L68,78 L32,78 L26,72 L30,58 L45,40 Z"
            fill="none" stroke="#E9EEFB" stroke-width="2.1" stroke-linejoin="miter"/>

      <g stroke="url(#brandGrad)" stroke-width="1.1" opacity="0.9">
        <line x1="50" y1="46.5" x2="56.6" y2="34.5"/>
        <line x1="56.6" y1="31.9" x2="51.4" y2="20.4"/>
      </g>
      <circle cx="50" cy="48" r="3.6" fill="url(#brandGrad)"/>
      <circle cx="57" cy="33" r="2.6" fill="url(#brandGrad)"/>
      <circle cx="51" cy="18" r="1.8" fill="#2DE2E6"/>
    </svg>

    <h1>SysonDev<span style="color:#7C8AAE; font-weight:600;"> Labs</span></h1>
    <p class="sub">Internet &middot; Crypto &middot; Automation</p>

    <div class="status"><span class="dot"></span> En construcción</div>

    <p class="msg">Estamos preparando SysonDev - Labs. Muy pronto más novedades por aquí.</p>

    <a class="contact" href="mailto:johan.pardo.munoz@gmail.com">Contactar</a>
  </main>

  <footer>&copy; 2026 SysonDev - Labs</footer>

  <script>
  (() => {
    const canvas = document.getElementById('bg-network');
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const COLORS = ['45, 226, 230', '124, 92, 252'];

    const mouse = { x: 0, y: 0, active: false };
    let particles = [];
    let dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = window.innerWidth * dpr;
      canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function initParticles() {
      const count = Math.min(70, Math.max(28, Math.floor((window.innerWidth * window.innerHeight) / 20000)));
      particles = Array.from({ length: count }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: reduceMotion ? 0 : (Math.random() - 0.5) * 0.22,
        vy: reduceMotion ? 0 : (Math.random() - 0.5) * 0.22,
        r: Math.random() * 1.3 + 0.9,
        c: COLORS[Math.random() < 0.5 ? 0 : 1],
      }));
    }

    function step() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      ctx.clearRect(0, 0, w, h);

      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -10) p.x = w + 10;
        if (p.x > w + 10) p.x = -10;
        if (p.y < -10) p.y = h + 10;
        if (p.y > h + 10) p.y = -10;

        if (mouse.active && !reduceMotion) {
          const dx = p.x - mouse.x;
          const dy = p.y - mouse.y;
          const dist = Math.hypot(dx, dy) || 1;
          const radius = 130;
          if (dist < radius) {
            const force = (radius - dist) / radius;
            p.x += (dx / dist) * force * 0.9;
            p.y += (dy / dist) * force * 0.9;
          }
        }
      }

      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const a = particles[i], b = particles[j];
          const dist = Math.hypot(a.x - b.x, a.y - b.y);
          if (dist < 105) {
            ctx.strokeStyle = `rgba(${a.c}, ${(1 - dist / 105) * 0.16})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }

      if (mouse.active) {
        for (const p of particles) {
          const dist = Math.hypot(p.x - mouse.x, p.y - mouse.y);
          if (dist < 150) {
            ctx.strokeStyle = `rgba(${p.c}, ${(1 - dist / 150) * 0.4})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(mouse.x, mouse.y);
            ctx.stroke();
          }
        }
      }

      for (const p of particles) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(${p.c}, 0.6)`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(step);
    }

    window.addEventListener('resize', () => { resize(); initParticles(); });
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
      mouse.active = true;
    });
    window.addEventListener('mouseleave', () => { mouse.active = false; });

    resize();
    initParticles();
    requestAnimationFrame(step);
  })();
  </script>

</body>
</html>
