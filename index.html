<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SysonDev - Labs</title>
<meta name="description" content="SysonDev - Labs. Muy pronto.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #060B1A;
    --surface: #0B1830;
    --cyan: #2DE2E6;
    --violet: #7C5CFC;
    --ice: #E9EEFB;
    --slate: #7C8AAE;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(circle at 50% 20%, #0B1830 0%, #060B1A 60%, #030612 100%);
    color: var(--ice);
    font-family: 'Futura', 'Century Gothic', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Sutil red de nodos de fondo */
  .nodes {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.35;
  }

  .nodes span {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px 1px rgba(45, 226, 230, 0.6);
    animation: drift 14s ease-in-out infinite;
  }

  .nodes span:nth-child(odd) { background: var(--violet); box-shadow: 0 0 8px 1px rgba(124, 92, 252, 0.6); }

  @keyframes drift {
    0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
    50% { transform: translateY(-18px) translateX(10px); opacity: 0.8; }
  }

  .card {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 56px 44px;
    max-width: 480px;
  }

  .logo {
    width: 132px;
    height: auto;
    margin: 0 auto 8px;
    display: block;
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 28px 0 6px;
    color: var(--ice);
  }

  .sub {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--slate);
    margin: 0 0 32px;
    text-transform: uppercase;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(45, 226, 230, 0.08);
    border: 1px solid rgba(124, 92, 252, 0.35);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ice);
    margin-bottom: 22px;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  p.msg {
    font-size: 15px;
    line-height: 1.6;
    color: var(--slate);
    margin: 0 0 30px;
  }

  .contact {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--ice);
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 10px;
    background: linear-gradient(135deg, rgba(45, 226, 230, 0.14), rgba(124, 92, 252, 0.14));
    border: 1px solid rgba(233, 238, 251, 0.12);
    transition: border-color 0.2s ease, transform 0.2s ease;
  }

  .contact:hover {
    border-color: rgba(45, 226, 230, 0.6);
    transform: translateY(-1px);
  }

  footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(124, 138, 174, 0.55);
    z-index: 1;
  }
</style>
</head>
<body>

  <div class="nodes" aria-hidden="true">
    <span style="top:12%; left:18%;"></span>
    <span style="top:22%; left:78%; animation-delay: 1s;"></span>
    <span style="top:68%; left:12%; animation-delay: 2s;"></span>
    <span style="top:78%; left:82%; animation-delay: 3s;"></span>
    <span style="top:40%; left:6%; animation-delay: 4s;"></span>
    <span style="top:15%; left:50%; animation-delay: 1.5s;"></span>
    <span style="top:85%; left:48%; animation-delay: 2.5s;"></span>
    <span style="top:55%; left:90%; animation-delay: 0.5s;"></span>
  </div>

  <main class="card">
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SysonDev Labs">
      <defs>
        <linearGradient id="brandGrad" x1="20" y1="12" x2="80" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2DE2E6"/>
          <stop offset="100%" stop-color="#7C5CFC"/>
        </linearGradient>
        <linearGradient id="hexStroke" x1="4" y1="10" x2="96" y2="90" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2DE2E6" stop-opacity="0.55"/>
          <stop offset="100%" stop-color="#7C5CFC" stop-opacity="0.35"/>
        </linearGradient>
        <clipPath id="flaskClip">
          <path d="M45,22 L55,22 L55,40 L70,58 L74,72 L68,78 L32,78 L26,72 L30,58 L45,40 Z"/>
        </clipPath>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="3.2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <polygon points="96,50 73,10 27,10 4,50 27,90 73,90" fill="#0B1830" stroke="url(#hexStroke)" stroke-width="1.4"/>

      <ellipse cx="50" cy="66" rx="20" ry="14" fill="#7C5CFC" opacity="0.22" filter="url(#glow)"/>

      <rect x="20" y="59" width="60" height="21" fill="url(#brandGrad)" clip-path="url(#flaskClip)"/>
      <path d="M45,22 L55,22 L55,40 L70,58 L74,72 L68,78 L32,78 L26,72 L30,58 L45,40 Z"
            fill="none" stroke="#E9EEFB" stroke-width="2.1" stroke-linejoin="miter"/>

      <g stroke="url(#brandGrad)" stroke-width="1.1" opacity="0.9">
        <line x1="50" y1="46.5" x2="56.6" y2="34.5"/>
        <line x1="56.6" y1="31.9" x2="51.4" y2="20.4"/>
      </g>
      <circle cx="50" cy="48" r="3.6" fill="url(#brandGrad)"/>
      <circle cx="57" cy="33" r="2.6" fill="url(#brandGrad)"/>
      <circle cx="51" cy="18" r="1.8" fill="#2DE2E6"/>
    </svg>

    <h1>SysonDev<span style="color:#7C8AAE; font-weight:600;"> Labs</span></h1>
    <p class="sub">Internet &middot; Crypto &middot; Automation</p>

    <div class="status"><span class="dot"></span> En construcción</div>

    <p class="msg">Estamos preparando SysonDev - Labs. Muy pronto más novedades por aquí.</p>

    <a class="contact" href="mailto:johan.pardo.munoz@gmail.com">Contactar</a>
  </main>

  <footer>&copy; 2026 SysonDev - Labs</footer>

</body>
</html>
